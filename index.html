<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Роадмап предсказатель</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f5f6f8; --card:#fff; --ink:#1c2230; --muted:#6b7385; --line:#e3e6ec; --line2:#eef0f4;
  --accent:#2f6fdb; --red:#d93a3a; --redbg:#fde8e8; --green:#1f9d57; --greenbg:#e6f6ec; --amber:#b7791f; --amberbg:#fdf3dc;
  --w:68px; --lw:640px;
  --vac:#f2a33a; --wsh:#8b5cf6; --team:#14b8a6; --hol:#94a3b8;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:13px/1.35 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
header{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:14px 20px;background:var(--card);border-bottom:1px solid var(--line)}
header h1{font-size:17px;margin:0;font-weight:650}
header .sub{color:var(--muted)}
header .sp{flex:1}
button,select,input{font:inherit;color:inherit}
button{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:5px 10px;cursor:pointer}
button:hover{background:#f0f3f9}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
button.primary:hover{background:#2560c4}
button.ghost{border-color:transparent;background:none;padding:2px 6px;color:var(--muted)}
button.ghost:hover{background:#e9edf4;color:var(--ink)}
input,select{border:1px solid var(--line);border-radius:5px;padding:4px 6px;background:#fff;min-width:0}
input:focus,select:focus{outline:2px solid #bcd3fa;border-color:var(--accent)}
main{padding:16px 20px 40px;display:flex;flex-direction:column;gap:18px}
section{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
section h2{font-size:14px;margin:0 0 10px;display:flex;align-items:center;gap:10px}
section h2 .hint{font-weight:400;color:var(--muted);font-size:12px}

/* capacity */
.tw{overflow-x:auto}
table.cap{border-collapse:collapse;width:100%;min-width:980px}
table.cap th{font-weight:550;color:var(--muted);font-size:11.5px;text-align:right;padding:4px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
table.cap th:first-child,table.cap td:first-child{text-align:left}
table.cap td{padding:6px 8px;text-align:right;border-bottom:1px solid var(--line2);white-space:nowrap}
table.cap td input{text-align:right;width:62px}
table.cap td input.edited{border-color:var(--accent);background:#f3f7ff}
table.cap td select{max-width:130px}
table.cap td:first-child input{text-align:left;width:150px}
.cnt{padding:3px 8px;min-width:58px;border-style:dashed;color:var(--ink)}
.cnt:hover{border-color:var(--accent);border-style:solid}
#popper{position:fixed;z-index:60;width:300px;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 28px rgba(20,28,45,.22);padding:12px}
#popper h4{margin:0 0 8px;font-size:13px;display:flex;align-items:center;gap:6px}
#popper .plist{max-height:150px;overflow:auto;margin-bottom:8px}
#popper .pi{display:flex;justify-content:space-between;align-items:center;padding:3px 0;border-bottom:1px solid var(--line2)}
#popper .pi small{color:var(--muted)}
#popper .none{color:var(--muted);padding:4px 0}
#popper .pf{display:grid;grid-template-columns:auto 1fr;gap:6px 8px;align-items:center}
#popper .pf label.all{grid-column:1/3;display:flex;gap:6px;align-items:center}
#popper .pf button{grid-column:1/3}
.sw{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:4px;vertical-align:-1px}
.pos{color:var(--green);font-weight:600}.neg{color:var(--red);font-weight:600}
td.rem span{padding:2px 7px;border-radius:10px}
td.rem .pos{background:var(--greenbg)}td.rem .neg{background:var(--redbg)}

/* toolbar */
.tb{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.tb .lbl{color:var(--muted);font-size:12px}
.legend{display:flex;gap:12px;color:var(--muted);font-size:12px;margin-left:auto;align-items:center;flex-wrap:wrap}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-2px;margin-right:4px}

/* gantt */
#ganttScroll{overflow:auto;max-height:72vh;border:1px solid var(--line);border-radius:8px;background:#fff;user-select:none}
.gwrap{position:relative;width:calc(var(--lw) + var(--w)*var(--n))}
.ghead{position:sticky;top:0;z-index:6;background:#fff}
.grow{display:flex}
.lft{flex:0 0 var(--lw);position:sticky;left:0;z-index:3;background:#fff;border-right:1px solid var(--line);padding:0 8px;display:flex;align-items:center}
.rgt{flex:0 0 calc(var(--w)*var(--n));position:relative;display:flex}
.cell{flex:0 0 var(--w);border-right:1px solid var(--line2)}
.cell.alt{background:#fafbfd}
.cell.over{background:var(--redbg)}
.ghead .lft{z-index:7}
.sprint{flex:0 0 calc(var(--w)*2);text-align:center;font-weight:600;font-size:12px;padding:4px 0;border-right:1px solid var(--line);border-bottom:1px solid var(--line2);background:#f0f3f9}
.sprint small{display:block;font-weight:400;color:var(--muted);font-size:10.5px}
.sprint:nth-child(even){background:#e8edf7}
.wk{flex:0 0 var(--w);text-align:center;font-size:11px;color:var(--muted);padding:3px 0;border-right:1px solid var(--line2);border-bottom:1px solid var(--line);background:#fff}
.lh{display:grid;grid-template-columns:14px 1fr 24px;gap:6px;width:100%;font-size:11px;color:var(--muted);font-weight:550;align-items:center}
.lh span{text-align:right}.lh span:nth-child(2){text-align:left}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);max-width:min(640px,92vw);background:#1c2230;color:#fff;padding:10px 16px;border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.3);z-index:80;display:none}
#toast.warn{background:#9b2c2c}
.tabs{display:flex;gap:2px;flex-wrap:wrap;border-bottom:1px solid var(--line);margin:-4px 0 -6px}
.tabbtn{border:none;border-bottom:3px solid transparent;border-radius:6px 6px 0 0;padding:9px 18px;font-size:14px;background:none;font-weight:600;color:var(--muted);margin-bottom:-1px}
.tabbtn:hover{background:#f0f3f9;color:var(--ink)}
.tabbtn.on{color:var(--accent);border-bottom-color:var(--accent);background:#f3f7ff}
.tabbtn span{margin-left:6px;font-weight:500;font-size:11px;background:#e8ecf4;color:var(--muted);border-radius:9px;padding:1px 6px}
.tabbtn.on span{background:#d9e6fc;color:var(--accent)}
.gh{height:30px;background:#e4ebf7;border-top:1px solid #cfd9ec}
.gh .lft{background:#e4ebf7;gap:12px}
.gh b{font-size:12.5px;text-transform:uppercase;letter-spacing:.04em;color:#27407a}
.gh .sum{font-size:11.5px;color:var(--muted)}
.gh .cell{background:#e4ebf7}
.dh{background:#f7f9fc;border-top:1px solid var(--line);height:52px}
.dh .lft{background:#f7f9fc;justify-content:space-between;gap:8px}
.dh .nm2{font-weight:650;font-size:13px}
.dh .sum{font-size:11.5px;color:var(--muted)}
.dh .btns{display:flex;gap:4px;flex-shrink:0}
.dh .btns button{font-size:11.5px;padding:3px 7px}
.dc{flex:0 0 var(--w);border-right:1px solid var(--line2);padding:3px 4px;display:flex;flex-direction:column;justify-content:space-between}
.dc .top{display:flex;justify-content:space-between;align-items:baseline;font-size:12px}
.dc .top b{font-size:12.5px}.dc .top small{color:var(--muted);font-size:10.5px}
.dc.ok{background:var(--greenbg)}.dc.low{background:#eef4ff}.dc.over{background:var(--redbg)}.dc.over .top b{color:var(--red)}
.days{display:flex;gap:2px}
.day{flex:1;height:13px;border-radius:2px;background:#dfe5ee}
.day.out{background:repeating-linear-gradient(45deg,#f1f2f5,#f1f2f5 3px,#e6e8ed 3px,#e6e8ed 6px);cursor:default}
.day.m-vacation{background:var(--vac)}.day.m-workshop{background:var(--wsh)}.day.m-team{background:var(--team)}.day.m-holiday{background:var(--hol)}
.day.today{outline:1.5px solid var(--ink);outline-offset:0}
.prow{min-height:46px;border-top:1px solid var(--line2)}
.prow .lft{padding:0 8px}
.pl{display:grid;grid-template-columns:14px 1fr 24px;gap:6px;width:100%;align-items:start}
.pl .grip{cursor:grab;font-size:15px;line-height:1;text-align:center;user-select:none}
.pl .grip:active{cursor:grabbing}
.prow.dragging{opacity:.4}
.prow.drop-before .lft,.prow.drop-before .rgt{box-shadow:inset 0 3px 0 var(--accent)}
.prow.drop-after .lft,.prow.drop-after .rgt{box-shadow:inset 0 -3px 0 var(--accent)}
.dh.drop-into{outline:2px solid var(--accent);outline-offset:-2px;background:#eef4ff}
.pl input.n,.pl select{width:100%}
.pl textarea.n{width:100%;resize:none;overflow:hidden;line-height:1.3;padding:5px 6px;margin:4px 0;font:inherit;border:1px solid var(--line);border-radius:5px;display:block}
.pl textarea.n:focus{outline:2px solid #bcd3fa;border-color:var(--accent)}
.pl input.num{width:100%;text-align:right;padding:4px 4px}
.pl .need{text-align:right;font-size:12px;line-height:1.15}
.pl .need small{display:block;font-size:10.5px}
.pl .c1{text-align:right;font-size:12.5px}
.pl .rest{display:flex;justify-content:flex-end;align-items:baseline;gap:5px;padding:3px 7px;border-radius:12px;font-size:12.5px;font-weight:600;justify-self:end;white-space:nowrap}
.rest small{font-weight:500;font-size:11px}
.rest.good{background:var(--greenbg);color:var(--green)}.rest.mid{background:var(--amberbg);color:var(--amber)}.rest.bad{background:var(--redbg);color:var(--red)}
.pl .nm{min-width:0;padding:4px 0}
.pl .nm textarea.n{margin:0 0 3px}
.sel2{display:flex;gap:4px}
.ddbtn{flex:1;min-width:0;display:flex;justify-content:space-between;align-items:center;gap:4px;font-size:11.5px;padding:2px 6px;border-radius:5px;text-align:left;white-space:nowrap;overflow:hidden}
.ddbtn.ph{color:var(--muted)}
.ddbtn span{color:var(--muted);font-size:9px}
#teamPop{position:fixed;z-index:60;width:290px;max-height:360px;overflow:auto;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 28px rgba(20,28,45,.22);padding:6px}
#teamPop .tg{margin-top:6px}
#teamPop .tg-h{display:flex;align-items:center;gap:2px;padding:3px 6px;font-weight:650;font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.03em}
#teamPop .tg-h b{flex:1;font-weight:650}
#teamPop .tt{display:flex;align-items:center;gap:2px;padding:4px 6px 4px 14px;border-radius:6px;cursor:pointer}
#teamPop .tt:hover{background:#f0f3f9}
#teamPop .tt.sel{background:#e8f0fe;font-weight:600}
#teamPop .tt span{flex:1}
#teamPop .ghost{font-size:12px;padding:0 5px;opacity:.7}
#teamPop .ghost:hover{opacity:1}
#teamPop .add{display:block;width:100%;text-align:left;border:none;color:var(--accent);padding:3px 6px 3px 14px;background:none}
#teamPop .add:hover{background:#f0f3f9}
#teamPop input{width:100%;margin:2px 0}
#teamPop .row{padding:2px 6px}
#teamPop hr{border:none;border-top:1px solid var(--line2);margin:6px 0}
.sel2 .dl-in{flex:0 0 112px;font-size:11.5px;padding:1px 3px;border:1px solid var(--line);border-radius:5px;color:var(--muted)}
.sel2 .dl-in.set{color:var(--red);border-color:#f0b4b4;font-weight:600}
.dlmark{position:absolute;top:0;bottom:0;width:3px;margin-left:-1.5px;background:var(--red);z-index:3;pointer-events:none;opacity:.9}
.dlmark::before{content:"";position:absolute;top:0;left:-3px;width:9px;height:9px;background:var(--red);clip-path:polygon(0 0,100% 0,50% 100%)}
.day.dl{background:var(--red)!important;outline:none}
.seg .pv{position:relative;z-index:1;text-shadow:0 0 3px rgba(0,0,0,.45)}
.seg .hatch{position:absolute;top:0;right:0;bottom:0;pointer-events:none;background:repeating-linear-gradient(135deg,rgba(15,20,35,.55) 0 4px,rgba(15,20,35,.2) 4px 8px)}
.sel2 select{flex:1;min-width:0;font-size:11.5px;padding:2px 3px}
.sts-take{color:var(--green)}.sts-cand{color:var(--amber)}.sts-hold{color:#3a7ca5}.sts-no{color:var(--red)}
.rest.off{background:#eef0f4;color:var(--muted)}
.prow.st-cand .seg,.prow.st-no .seg{opacity:.4}
.prow.st-hold .seg{opacity:.75}
.prow.st-cand .pl .n,.prow.st-no .pl .n{color:var(--muted)}
.pl .acts{display:flex;justify-content:flex-end}
.seg{position:absolute;top:50%;margin-top:-15px;height:30px;width:var(--w);display:flex;align-items:center;justify-content:center;font-size:11.5px;font-weight:600;border-right:1px solid rgba(255,255,255,.35);overflow:hidden;color:#fff;cursor:grab;z-index:1;background:var(--c);box-shadow:0 1px 2px rgba(0,0,0,.15)}
.seg:active{cursor:grabbing}
.seg.cs{border-radius:6px 0 0 6px}.seg.ce{border-radius:0 6px 6px 0;border-right:none}.seg.cs.ce{border-radius:6px}
.seg.over{background-image:repeating-linear-gradient(135deg,rgba(217,58,58,.9) 0 5px,rgba(217,58,58,.55) 5px 10px)}
.empty{padding:26px;text-align:center;color:var(--muted)}
.foot{margin-top:10px;color:var(--muted);font-size:12px;line-height:1.5}
.foot b{color:var(--ink)}
.pop{position:fixed;z-index:50}
.presets{display:grid;grid-template-columns:repeat(4,52px);gap:4px;padding:8px;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 24px rgba(20,28,45,.25)}
.presets button{padding:5px 0;text-align:center}
.presets button.clr{grid-column:span 2;color:var(--red)}
.presets button.on{background:var(--accent);border-color:var(--accent);color:#fff}
dialog{border:1px solid var(--line);border-radius:12px;padding:18px;width:min(720px,94vw)}
dialog::backdrop{background:rgba(20,28,45,.4)}
dialog h3{margin:0 0 10px}
dialog textarea{width:100%;height:130px;font:12px/1.4 ui-monospace,Menlo,monospace;border:1px solid var(--line);border-radius:6px;padding:8px}
.frow{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:8px 0}
.frow label{display:flex;gap:5px;align-items:center}
.prev{max-height:150px;overflow:auto;border:1px solid var(--line);border-radius:6px;font-size:12px;margin-top:6px}
.prev table{border-collapse:collapse;width:100%}.prev td,.prev th{padding:3px 8px;border-bottom:1px solid var(--line2);text-align:left}
.dlgact{display:flex;justify-content:flex-end;gap:8px;margin-top:12px}

/* ---------- skin: monochrome / editorial ---------- */
:root{
  --bg:#ececee; --card:#fff; --ink:#0b0b0c; --muted:#85858c; --line:#d9d9de; --line2:#ececef;
  --accent:#0b0b0c; --red:#e0393e; --redbg:#fbe8e8; --green:#1f9d62; --greenbg:#e1f5ea; --amber:#8a6a14; --amberbg:#f3edd9;
  --vac:#0b0b0c; --wsh:#5fd88a; --team:#9a9aa2; --hol:#c9c9ce;
  --mono:'JetBrains Mono',ui-monospace,Menlo,monospace;
}
body{font-family:'Manrope',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);font-size:13px;letter-spacing:-.005em}
header{background:transparent;border-bottom:none;padding:22px 28px 4px;gap:14px}
header .logo{flex:none}
header h1{font-size:26px;font-weight:300;letter-spacing:-.03em}
.crumb{display:flex;align-items:center;gap:8px;font:400 11.5px var(--mono);color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.crumb i{font-style:normal;opacity:.5}
main{padding:12px 28px 48px;gap:22px}
button{border-radius:8px;border:1px solid var(--line);background:#fff;font-weight:500}
button:hover{background:#f3f3f5}
button.primary{background:var(--ink);border-color:var(--ink);color:#fff}
button.primary:hover{background:#26262a}
button.ghost{border-color:transparent;background:none}
button.ghost:hover{background:#ececef}
input,select{border:1px solid var(--line);border-radius:7px}
input:focus,select:focus{outline:2px solid #c9c9ce;border-color:var(--ink)}
section{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px 20px}
section h2{font:500 11.5px var(--mono);text-transform:uppercase;letter-spacing:.09em;color:#3c3c41;margin-bottom:14px}
section h2 .hint{font:400 12px 'Manrope',sans-serif;text-transform:none;letter-spacing:0;color:var(--muted)}

section h2{flex-wrap:wrap;row-gap:6px}
section h2 button{white-space:nowrap}
section h2 .hint{flex:1 1 260px}
/* project row: name on top, controls below */
.pl .nm{padding:8px 0}
.pl textarea.n{margin:0 0 7px;padding:7px 10px;font-size:13.5px}
.sel2{flex-wrap:wrap;gap:6px;align-items:center}
.ddbtn,.sel2 select,.sel2 .dl-in,.sel2 input.num{height:34px;font-size:12.5px;padding:0 9px}
.ddbtn{flex:1 1 96px;min-width:90px}
.ddbtn em{font-style:normal;overflow:hidden;text-overflow:ellipsis}
.sel2 select{flex:0 0 92px}
.sel2 .dl-in{flex:0 0 124px}
.mini{display:flex;align-items:center;gap:5px;white-space:nowrap;font-size:12px;color:var(--muted)}
.mini input.num{width:54px;text-align:right}
.mini.c1{gap:4px}.mini.c1 b{font-size:13.5px;font-weight:600;color:var(--ink)}
.sel2 .rest{height:34px;display:flex;align-items:center;flex:0 0 auto;border-radius:17px;padding:0 12px}
.pl .grip{height:34px;margin-top:8px;display:flex;align-items:center;justify-content:center}
.pl .acts{height:34px;margin-top:8px;display:flex;align-items:center;justify-content:center;padding:0}
/* hero people */
.hero-top{display:flex;align-items:flex-end;gap:48px;flex-wrap:wrap;margin-bottom:14px}
.hero-top .big{margin-bottom:0}
.people{display:flex;gap:10px;flex-wrap:wrap;padding-bottom:10px;flex:1 1 320px}
.person{min-width:150px;padding:12px 16px 12px;background:#fff;border:1px solid var(--line);border-radius:12px;display:flex;flex-direction:column;gap:2px}
.person label{font:400 10.5px var(--mono);text-transform:uppercase;letter-spacing:.07em;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:180px}
.person b{font-size:32px;font-weight:300;letter-spacing:-.04em;line-height:1.1}
.person b small{font-size:13px;color:var(--muted);font-weight:400;letter-spacing:0}
.person .pbar{height:3px;background:#e4e4e8;border-radius:2px;margin:6px 0 4px;overflow:hidden}
.person .pbar i{display:block;height:100%;background:var(--ink)}
.person em{font:400 10.5px var(--mono);font-style:normal;color:var(--muted)}
.person.neg b,.person.neg b small{color:var(--red)}
.person.neg .pbar i{background:var(--red)}
.person.neg{border-color:#f0b4b4}
/* project row: single-line controls */
.sel2{flex-wrap:nowrap;gap:6px}
.sel2 .ddbtn{flex:1 1 60px;min-width:60px}
.sel2 .ddbtn em{white-space:nowrap}
.sel2 select{flex:0 0 94px}
.dlw{position:relative;flex:0 0 34px;height:34px}
.dlbtn{width:34px;height:34px;padding:0;display:flex;align-items:center;justify-content:center;color:var(--muted)}
.dlbtn:hover{color:var(--ink)}
.dlbtn.set{color:var(--red);border-color:#f0b4b4;background:var(--redbg)}
.dlw input{position:absolute;inset:0;width:100%;height:100%;opacity:0;pointer-events:none;border:none}
.fld{display:flex;align-items:center;gap:4px;height:34px;padding:0 9px;border:1px solid var(--line);border-radius:7px;background:#fff;flex:0 0 auto;white-space:nowrap}
.fld:focus-within{outline:2px solid #c9c9ce;border-color:var(--ink)}
.fld input{border:none;background:transparent;padding:0;width:34px;text-align:right;font-size:12.5px;color:var(--ink);outline:none}
.fld input:focus{outline:none}
.fld input::-webkit-inner-spin-button,.fld input::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
.fld input[type=number]{-moz-appearance:textfield}
.fld span{font-size:11.5px;color:var(--muted)}
.fld.ro{background:#f6f6f7}
.fld.ro input{color:var(--muted);cursor:default}
.ddbtn.ph em,.ddbtn.ph{color:var(--muted)}
/* sticky header: left cell covers the full height of its row */
.ghead .lft{align-self:stretch}
.ghead .lft.hl1{min-height:36px}
.ghead .lft.hl2{min-height:24px;border-bottom:1px solid var(--line)}
/* hero */
#hero{padding:6px 2px 4px}
.hero .hl-label{font:500 11.5px var(--mono);text-transform:uppercase;letter-spacing:.09em;color:var(--muted)}
.hero .big{font-size:92px;font-weight:300;letter-spacing:-.05em;line-height:1.02;margin:4px 0 14px}
.hero .big span{font-size:34px;letter-spacing:-.02em;color:#a2a2a9;margin-left:10px}
.hero .big.neg{color:var(--red)}
.kpis{display:flex;gap:0;flex-wrap:wrap;border-top:1px solid #cfcfd4}
.kpis>div{padding:12px 34px 4px 0;margin-right:34px;border-right:1px solid #dcdce0}
.kpis>div:last-child{border-right:none}
.kpis label{display:block;font:400 10.5px var(--mono);text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin-bottom:4px}
.kpis b{font-size:26px;font-weight:300;letter-spacing:-.03em}
.kpis small{font-size:13px;color:var(--muted);font-weight:400}
.kpis .bad b{color:var(--red)}

/* tabs */
.tabs{border-bottom:none;gap:8px;margin:0}
.tabbtn{border:1px solid var(--line);border-bottom:1px solid var(--line);border-radius:9px;background:#fff;color:var(--ink);padding:8px 16px;font-size:13px;font-weight:600;margin:0}
.tabbtn:hover{background:#f3f3f5;color:var(--ink)}
.tabbtn.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.tabbtn span{background:#ececef;color:var(--muted);font-family:var(--mono);font-size:10.5px;margin-left:8px}
.tabbtn.on span{background:#3a3a40;color:#fff}

/* capacity */
table.cap th{font:400 10.5px var(--mono);text-transform:uppercase;letter-spacing:.06em;color:var(--muted);border-bottom:1px solid var(--line)}
table.cap td{border-bottom:1px solid var(--line2)}
table.cap td input.edited{border-color:var(--ink);background:#f6f6f7}
.cnt{border-radius:8px}
.cnt:hover{border-color:var(--ink)}
td.rem .pos{background:var(--greenbg);color:var(--green)}
#popper,#teamPop{border-radius:12px}

/* gantt */
#ganttScroll{border-radius:12px;border-color:var(--line)}
.sprint{background:#f5f5f7;font-weight:600;border-bottom:1px solid var(--line2)}
.sprint:nth-child(even){background:#ececef}
.sprint small{font-family:var(--mono);font-size:10px}
.wk{font-family:var(--mono);font-size:10.5px}
.lh{font:400 10.5px var(--mono);text-transform:uppercase;letter-spacing:.05em}
.cell.alt{background:#f8f8f9}
.gh{background:var(--ink);border-top:none;height:32px}
.gh .lft{background:var(--ink);color:#fff}
.gh b{color:#fff;font:500 12px var(--mono);letter-spacing:.09em}
.gh .sum{color:#a9a9b1}
.gh .sum .pos{color:#5fd88a}.gh .sum .neg{color:#ff7b80}
.gh .cell{background:var(--ink);border-right-color:#26262a}
.dh{background:#f6f6f7}
.dh .lft{background:#f6f6f7}
.dh .nm2{font-weight:700}
.dc.ok{background:var(--greenbg)}.dc.low{background:#f0f0f2}
.dc .top b{font-weight:600}
.day{background:#dcdce0;border-radius:3px}
.day.m-holiday{background:repeating-linear-gradient(135deg,#8a8a92 0 2px,#d3d3d8 2px 4px)}
.day.dl{background:var(--red)!important}
.prow{border-top:1px solid var(--line2)}
.seg{border-radius:7px;font-weight:600}
.seg.cs{border-radius:7px 0 0 7px}.seg.ce{border-radius:0 7px 7px 0}.seg.cs.ce{border-radius:7px}
.seg.lt{color:#0b0b0c}.seg.lt .pv{text-shadow:none}
.seg.over{background-image:repeating-linear-gradient(135deg,rgba(224,57,62,.88) 0 5px,rgba(224,57,62,.55) 5px 10px)}
.seg.over.lt{color:#fff}
.pl textarea.n{border-radius:8px;font-weight:500}
.rest{font-family:var(--mono);font-size:12px}
.rest.mid{background:var(--amberbg);color:var(--amber)}
.rest.off{background:#ececef;color:var(--muted)}
.ddbtn,.sel2 select,.sel2 .dl-in{border-radius:7px}
.presets button.on{background:var(--ink);border-color:var(--ink)}
#toast{background:var(--ink);border-radius:12px}
.foot{font-size:12px}
dialog{border-radius:14px}
.ghead{display:flex}
.ghead .hlx{border-bottom:1px solid var(--line);align-items:center}
.hcols{display:flex;flex-direction:column;flex:0 0 calc(var(--w)*var(--n))}
.hcols .rgt{flex:0 0 auto;width:calc(var(--w)*var(--n))}
.ghead .lh{font:700 24px 'Manrope',sans-serif;text-transform:none;letter-spacing:-.03em;color:var(--ink);align-items:center}
/* common left edge: grip column (14px) + gap (6px) + side padding (8px) = 28px */
.dh .lft,.gh .lft{padding-left:28px}
.pl .acts{height:auto;flex-direction:column;gap:3px;align-items:center;justify-content:flex-start}
.pl .acts button{height:34px;width:24px;padding:0;display:flex;align-items:center;justify-content:center;color:var(--muted)}
.pl .acts button:hover{color:var(--ink)}
#toast .undo{margin-left:14px;background:transparent;color:#fff;border:1px solid rgba(255,255,255,.45);padding:3px 10px;border-radius:8px}
#toast .undo:hover{background:rgba(255,255,255,.15)}
/* consecutive weeks form one continuous bar: only the outer ends are rounded */
.seg{border-radius:0;border-right:none}
.seg.cs{border-radius:7px 0 0 7px}
.seg.ce{border-radius:0 7px 7px 0}
.seg.cs.ce{border-radius:7px}
.nmrow{display:flex;gap:6px;align-items:flex-start}
.pl .nmrow textarea.n{flex:1;min-width:0;width:auto}
.notebtn{flex:0 0 34px;width:34px;height:34px;padding:0;display:flex;align-items:center;justify-content:center;color:var(--muted);position:relative}
.notebtn:hover{color:var(--ink)}
.notebtn.has{color:var(--ink);background:#f3edd9;border-color:#e2d7ae}
.notebtn.has::after{content:"";position:absolute;top:5px;right:5px;width:6px;height:6px;border-radius:50%;background:var(--green)}
#noteDlg textarea{width:100%;font:13.5px/1.5 'Manrope',sans-serif;padding:10px 12px;border:1px solid var(--line);border-radius:10px;resize:vertical}
/* active field: plain black border, no glow */
input:focus,textarea:focus,select:focus,
.pl textarea.n:focus,#noteDlg textarea:focus,#teamPop input:focus,#popper input:focus{outline:none!important;border-color:var(--ink)!important;box-shadow:none}
.fld:focus-within{outline:none;border-color:var(--ink)}
.fld input:focus{border:none!important}
section.tl{padding:0;overflow:hidden}
section.tl #ganttScroll{border:none;border-radius:0}
.ghead,.ghead .lft,.ghead .sprint,.ghead .sprint:nth-child(even),.ghead .wk{background:#fff}
.ghead .sprint{padding:8px 0 7px;border-right:1px solid var(--line);border-bottom:1px solid var(--line2)}
.ttl{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.ttl h1{margin:0;line-height:1.1}
.ttl .crumb{line-height:1.1}
/* period switcher */
.periodbar{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.yr{display:flex;align-items:center;background:#fff;border:1px solid var(--line);border-radius:9px;padding:3px}
.yr b{font:500 14px var(--mono);padding:0 12px;letter-spacing:.02em}
.yr button{border:none;background:none;padding:4px 10px;font-size:17px;line-height:1;color:var(--muted)}
.yr button:hover{background:#ececef;color:var(--ink)}
.qseg{display:flex;gap:6px}
.qbtn{position:relative;border:1px solid var(--line);border-radius:9px;background:#fff;padding:8px 20px;font:500 13px var(--mono);letter-spacing:.04em}
.qbtn:hover{background:#f3f3f5}
.qbtn.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.qbtn i{position:absolute;top:5px;right:6px;width:6px;height:6px;border-radius:50%;background:#5fd88a}
/* section headings: one style for 'Капасити дизайнеров' and 'Проекты' */
section h2,.ghead .lh{font:700 24px 'Manrope',sans-serif;text-transform:none;letter-spacing:-.03em;color:var(--ink)}
section h2{margin:0 0 16px}
section h2 button{font:500 13px 'Manrope',sans-serif;letter-spacing:0}
/* analytics */
.vsw{display:flex;background:#fff;border:1px solid var(--line);border-radius:9px;padding:3px;gap:2px}
.vsw button{border:none;background:none;padding:6px 14px;font-weight:600;border-radius:7px}
.vsw button.on{background:var(--ink);color:#fff}
.periodbar .sp{flex:1}
.qchip{display:inline-block;padding:4px 10px;border-radius:12px;font:500 11.5px var(--mono);background:#ececef;color:var(--muted);white-space:nowrap}
.qchip.active{background:#e1f5ea;color:#1f9d62}.qchip.final{background:var(--ink);color:#fff}
.an{padding:20px 22px}
.an-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:6px}
.an-head h2{margin:0}.an-head .sp{flex:1}
.an-head select{height:34px}
.an-note{color:var(--muted);margin:4px 0 16px;max-width:820px;line-height:1.5}
.an-kpis{display:flex;flex-wrap:wrap;border-top:1px solid #cfcfd4;margin-bottom:6px}
.an-kpis>div{padding:12px 30px 6px 0;margin-right:30px;border-right:1px solid #dcdce0}
.an-kpis>div:last-child{border-right:none}
.an-kpis label{display:block;font:400 10.5px var(--mono);text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin-bottom:4px}
.an-kpis b{font-size:28px;font-weight:300;letter-spacing:-.03em}.an-kpis small{font-size:13px;color:var(--muted);font-weight:400}
.an-h3{font:700 16px 'Manrope',sans-serif;margin:24px 0 10px;letter-spacing:-.01em}
table.art{border-collapse:collapse;width:100%;min-width:760px}
table.art th{font:400 10.5px var(--mono);text-transform:uppercase;letter-spacing:.05em;color:var(--muted);text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
table.art td{padding:8px;border-bottom:1px solid var(--line2);vertical-align:top}
table.art td.num{text-align:right;font-variant-numeric:tabular-nums}
table.art td.pn{font-weight:600;max-width:260px}
table.art tr.gone td{color:var(--muted);text-decoration:line-through}
table.art small{color:var(--muted)}
table.yt tbody tr{cursor:pointer}table.yt tbody tr:hover{background:#f6f6f7}table.yt tr.cur{background:#f3f7f4}
.st{display:inline-block;padding:2px 8px;border-radius:10px;background:#ececef;font-size:11.5px;white-space:nowrap}
.st.s-take{background:#e1f5ea;color:#1f9d62}.st.s-cand{background:#f3edd9;color:#8a6a14}.st.s-hold{background:#e3ecf5;color:#3a7ca5}.st.s-no,.st.s-gone{background:#fbe8e8;color:#e0393e}
.atag{display:inline-block;margin:0 4px 3px 0;padding:2px 8px;border-radius:10px;font-size:11.5px;white-space:nowrap;background:#ececef}
.atag.t-add{background:#e1f5ea;color:#1f9d62}.atag.t-rm{background:#fbe8e8;color:#e0393e}.atag.t-mv{background:#f3edd9;color:#8a6a14}.atag.t-hold{background:#e3ecf5;color:#3a7ca5}
.muted{color:var(--muted)}
.adz{border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:14px}
.adz-h{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.adz-h>b{font-size:17px;letter-spacing:-.01em}
.chip{padding:2px 9px;border-radius:10px;background:#ececef;font-size:11.5px;color:var(--muted)}
.adz-s{display:flex;gap:18px;flex-wrap:wrap;margin-left:auto;color:var(--muted);font-size:12px}.adz-s b{color:var(--ink)}
.acom{margin:10px 0 8px;padding:10px 12px;background:#f6f6f7;border-radius:10px}
.acom label{font:400 10.5px var(--mono);text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.acom p{margin:4px 0 0;line-height:1.55}
.adz textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:8px 10px;font:13px 'Manrope',sans-serif;resize:vertical}
.alog{list-style:none;margin:0;padding:0;max-height:340px;overflow:auto;border:1px solid var(--line);border-radius:10px}
.alog li{display:flex;gap:12px;padding:7px 12px;border-bottom:1px solid var(--line2)}
.alog li:last-child{border-bottom:none}
.alog time{font:400 11.5px var(--mono);color:var(--muted);white-space:nowrap}
.dh .nm2{position:relative}
.ddot{position:absolute;left:-18px;top:4px;width:10px;height:10px;border-radius:3px}
table.cap td.clr{white-space:nowrap}
.sw2{display:inline-block;width:12px;height:12px;border-radius:4px;margin-right:6px;vertical-align:-2px}
.sw2.wh,.ddot.wh{box-shadow:inset 0 0 0 1px #c9c9ce}
.seg.lt{color:#0b0b0c}
.seg.lt .pv{text-shadow:none}
.seg.wh{box-shadow:inset 0 0 0 1px #b9b9c0}
.pl .grip{color:#a2a2a9}
.pl .grip:hover{color:var(--ink)}
/* week fills: no green; red = over capacity; tint = vacation / workshop / team building / holiday */
.dc.ok,.dc.low{background:none}
.dc.over,.cell.over{background:none;background-image:linear-gradient(rgba(224,57,62,.14),rgba(224,57,62,.14))}
.dc.over .top b{color:var(--red)}
/* weeks are white; only over-capacity weeks get a translucent red fill */
.cell,.cell.alt,.dc,.dc.ok,.dc.low{background-color:#fff;background-image:none}
.dc.over,.cell.over{background-color:#fff;background-image:linear-gradient(rgba(224,57,62,.14),rgba(224,57,62,.14))}
table.cap td.clr{text-align:left;padding-left:12px}
.clrpin{width:24px;height:24px;border-radius:7px;padding:0;border:1px solid rgba(0,0,0,.12);cursor:pointer;vertical-align:middle}
.clrpin:hover{box-shadow:0 0 0 3px #e4e4e8}
.clrpin.wh{box-shadow:inset 0 0 0 1px #c9c9ce}
#clrPop{position:fixed;z-index:70;width:300px;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 8px 28px rgba(20,28,45,.22);padding:6px;display:grid;grid-template-columns:1fr 1fr;gap:2px}
#clrPop button{display:flex;align-items:center;gap:8px;border:none;background:none;text-align:left;padding:7px 8px;border-radius:7px;font-size:12.5px}
#clrPop button:hover{background:#f0f0f2}
#clrPop button.on{background:#ececef;font-weight:700}
#clrPop i{width:14px;height:14px;border-radius:4px;flex:none;border:1px solid rgba(0,0,0,.12)}
/* range calendar in the period popover */
#popper{width:340px}
#popper .cwd{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;color:var(--muted);font-size:11.5px;padding:2px 0 4px;border-top:1px solid var(--line2)}
#popper .cal{max-height:330px;overflow:auto;margin-bottom:8px}
#popper .cm{font-weight:700;font-size:14px;margin:12px 4px 6px}
#popper .cg{display:grid;grid-template-columns:repeat(7,1fr);row-gap:2px}
#popper .cd{height:38px;border:none;background:none;border-radius:0;padding:0;font:500 13px 'Manrope',sans-serif;position:relative;color:var(--ink)}
#popper .cd:hover{background:#ececef;border-radius:19px}
#popper .cd.we{color:#a2a2a9}
#popper .cd.mk{background:#e1e1e5;border-radius:0}
#popper .cd.mk.ml{border-radius:19px 0 0 19px}
#popper .cd.mk.mr{border-radius:0 19px 19px 0}
#popper .cd.mk.ml.mr{border-radius:19px}
#popper .cd.mk:hover{background:#d3d3d8}
#popper .cd.in{background:#efeff1;border-radius:0}
#popper .cd.st,#popper .cd.en{background:var(--ink);color:#fff;border-radius:19px}
#popper .csel{font:500 12.5px 'Manrope',sans-serif;padding:8px 10px;background:#f6f6f7;border-radius:8px;margin-bottom:8px;text-align:center}
#popper .pf{display:grid;grid-template-columns:1fr;gap:8px}
#popper .pf label.all,#popper .pf button{grid-column:auto}
#popper .pf button:disabled{opacity:.45;cursor:default}
</style>
</head>
<body>
<header>
  <div class="ttl"><h1>Роадмап предсказатель</h1><span class="crumb" id="qlabel"></span></div>
  <span class="sp"></span>
  <button id="btnCsv" class="primary">Импорт проектов (CSV)</button>
  <button id="btnExport">Экспорт JSON</button>
  <button id="btnImportJson">Импорт JSON</button>
  <button id="btnClear">Очистить всё</button>
  <input type="file" id="fileJson" accept=".json,application/json" hidden>
</header>
<main>
  <div id="periodbar" class="periodbar"></div>
  <div id="tabs" class="tabs"></div>
  <div id="hero"></div>
  <section id="secCap">
    <h2>Капасити дизайнеров
      <button id="btnClearMarks" style="margin-left:auto" title="Стереть все отпуска, воркшопы, тимбилдинги и праздники у всех дизайнеров">Сбросить все дни</button>
      <button id="btnAddD">+ Дизайнер</button></h2>
    <div class="tw"><table class="cap" id="cap"></table></div>
  </section>
  <section class="tl">
    <div id="ganttScroll"><div class="gwrap" id="gantt"></div></div>
  </section>
  <section id="analytics" class="an" style="display:none"></section>
</main>

<dialog id="groupDlg" style="width:min(360px,94vw)">
  <h3>Новая группа</h3>
  <input id="groupName" placeholder="Название группы, например НВС" style="width:100%">
  <div class="dlgact"><button id="groupCancel">Отмена</button><button id="groupOk" class="primary">Создать</button></div>
</dialog>
<dialog id="noteDlg" style="width:min(520px,94vw)">
  <h3 id="noteTitle">Заметка</h3>
  <textarea id="noteText" rows="7" placeholder="Комментарий к проекту: контекст, договорённости, ссылки…"></textarea>
  <div class="dlgact"><button id="noteDel" style="margin-right:auto;color:var(--red)">Удалить заметку</button><button id="noteCancel">Отмена</button><button id="noteSave" class="primary">Сохранить</button></div>
</dialog>
<dialog id="csvDlg">
  <h3>Импорт проектов из CSV</h3>
  <div class="frow"><input type="file" id="csvFile" accept=".csv,.tsv,.txt"><span style="color:var(--muted)">или вставьте таблицу ниже (можно прямо из Google Sheets)</span></div>
  <textarea id="csvText" placeholder="Название&#9;Оценка, дни&#9;Дизайнер"></textarea>
  <div class="frow">
    <label><input type="checkbox" id="csvHdr" checked> первая строка — заголовки</label>
    <label>Название <select id="cName"></select></label>
    <label>Оценка (дни) <select id="cEst"></select></label>
    <label>Дизайнер <select id="cDes"></select></label>
    <label>Команда <select id="cTeam"></select></label>
  </div>
  <div class="frow">
    <label>Режим <select id="csvMode"><option value="merge">Добавить новые, обновить оценки у совпадающих названий</option><option value="replace">Заменить весь список проектов</option></select></label>
    <label><input type="checkbox" id="csvNewD" checked> создавать новых дизайнеров из столбца</label>
  </div>
  <div class="prev" id="csvPrev"></div>
  <div class="dlgact"><button id="csvCancel">Отмена</button><button id="csvGo" class="primary">Импортировать</button></div>
</dialog>

<script>
(function(){
'use strict';
// ---------- config ----------
let Q_START, Q_END, WEEK0, N = 14, qDays = 66, flatDays = [];   // зависят от выбранного квартала, см. setPeriod()
const W = 68, HRS = 8;
// палитра дизайнеров (цвета таймлайна)
const PALETTE = [['Gold','#FFD700'],['MediumVioletRed','#C71585'],['SeaGreen','#2E8B57'],['DarkCyan','#008B8B'],['Blue','#0000FF'],['MidnightBlue','#191970'],['DarkMagenta','#8B008B'],['DarkSlateBlue','#483D8B'],['Black','#000000'],['LightSlateGray','#778899'],['DarkSlateGray','#2F4F4F'],['DeepSkyBlue','#00BFFF'],['DarkOliveGreen','#556B2F'],['MediumSlateBlue','#7B68EE'],['BlueViolet','#8A2BE2']];
const AUTO_ORDER = PALETTE.map(x=>x[0]);
const hexOf = n => (PALETTE.find(x=>x[0]===n)||[])[1];
function isLight(hex){ const v=parseInt(hex.slice(1),16), r=v>>16, g=(v>>8)&255, b=v&255; return (0.299*r+0.587*g+0.114*b)>150; }
const TYPES = {vacation:'отпуск',workshop:'воркшоп',team:'тимбилдинг',holiday:'праздник'};
const KEY = 'loadplanner.q426.v1';
const WD = ['пн','вт','ср','чт','пт'];
const ST={take:'Берем',cand:'Кандидат',hold:'Hold',no:'Не берем'};

const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2,'0');
const iso = d => d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const dm = d => pad(d.getDate())+'.'+pad(d.getMonth()+1);
const fmt = n => String(Math.round(n));
const clamp = (v,a,b) => Math.max(a,Math.min(b,v));

// ---------- calendar ----------
const weeks = [];
function setPeriod(y,q){
  Q_START=new Date(y,(q-1)*3,1); Q_END=new Date(y,q*3,0);
  const dow=(Q_START.getDay()+6)%7;                      // 0 = понедельник
  WEEK0=dow>=5 ? new Date(y,(q-1)*3,1+(7-dow)) : new Date(y,(q-1)*3,1-dow);
  N=Math.floor(Math.round((Q_END-WEEK0)/864e5)/7)+1;
  weeks.length=0;
  for(let w=0; w<N; w++){
    const days=[];
    for(let i=0;i<5;i++){
      const d=new Date(WEEK0.getFullYear(),WEEK0.getMonth(),WEEK0.getDate()+w*7+i);
      days.push({d, iso:iso(d), inQ: d>=Q_START && d<=Q_END});
    }
    weeks.push(days);
  }

  flatDays=weeks.flat().filter(x=>x.inQ);
  document.documentElement.style.setProperty('--n',N);
}

function deadlinePos(iso){      // x внутри строки таймлайна для даты, либо null вне квартала-таймлайна
  if(!iso) return null;
  const [y,m,dd]=iso.split('-').map(Number), t=new Date(y,m-1,dd);

function plannedDays(p){ const d=dById(p.designer); let s=0; Object.keys(p.weeks).forEach(w=>{ s+=p.weeks[w]/100*availDays(d,+w); }); return s; }
const qdKey = () => keyOf(state.cur);

function capOf(d){
  const c={vacation:0,workshop:0,team:0,holiday:0};
  weeks.flat().forEach(x=>{ if(x.inQ && d.marks[x.iso]) c[d.marks[x.iso]]++; });
  const total=daysOf(d), off=c.vacation+c.workshop+c.team+c.holiday, avail=total-off;
  const ps=state.projects.filter(p=>p.designer===d.id);

}

      const top=['vacation','workshop','team','holiday'].filter(t=>cnt[t]).sort((a,b)=>cnt[b]-cnt[a])[0];

    h+=`<div class="grow dh" data-did="${d.id}" data-drop="${d.id}"><div class="lft"><div><div class="nm2"><i class="ddot ${colorOf(d)==='#FFFFFF'?'wh':''}" style="background:${colorOf(d)}"></i>${esc(d.name)} <span class="sum">· ФФ ${Math.round(focusOf(d)*100)}%</span></div>
      <div class="sum">доступно ${c.avail} дн · <span class="${c.rem<0?'neg':'pos'}">остаток ${c.rem<0?'−':''}${fmt(Math.abs(c.rem))}</span></div></div>

    state.projects.filter(p=>p.designer===d.id).forEach(p=>{ h+=projRow(p,over,tints); });

  const free=state.projects.filter(p=>!dById(p.designer)&&projectInTab(p));

  else if(a==='up'||a==='down'){ move(p,a==='up'?-1:1); }

function move(p,dir){
  const arr=state.projects, i=arr.indexOf(p);
  for(let j=i+dir; j>=0&&j<arr.length; j+=dir){ if(arr[j].designer===p.designer){ arr[i]=arr[j]; arr[j]=p; return; } }
}
const MAX_PER_WEEK=3;
function aiSort(d){
  const f=focusOf(d), used=new Array(N).fill(0), cnt=new Array(N).fill(0);
  // «Hold» не перекладываем: их недели остаются как есть и занимают место
  state.projects.forEach(p=>{ if(p.designer===d.id && p.status==='hold') for(let w=0;w<N;w++) if(p.weeks[w]>0){ used[w]+=p.weeks[w]; cnt[w]++; } });
  const slots=[], todo=[];
  state.projects.forEach((p,i)=>{ if(p.designer===d.id && p.status==='take'){ slots.push(i); todo.push(p); } });
  // сначала проекты с ближайшим дедлайном, без дедлайна — в конце, внутри равных сохраняем текущий порядок
  const sorted=todo.map((p,i)=>({p,i})).sort((a,b)=>{
    const x=a.p.deadline||'9999', y=b.p.deadline||'9999';
    return x<y?-1:x>y?1:a.i-b.i;
  }).map(o=>o.p);
  slots.forEach((idx,k)=>{ state.projects[idx]=sorted[k]; });
  const lacking=[], late=[]; let lastW=-1;
  sorted.forEach(p=>{
    p.weeks={}; let rem=(+p.est||0)/f, endW=-1;
    for(let w=0; w<N && rem>0.05; w++){
      const a=availDays(d,w); if(a<=0||cnt[w]>=MAX_PER_WEEK) continue;
      const free=Math.floor((100-used[w])/10)*10; if(free<10) continue;
      const need10=Math.ceil(rem/a*10)*10;
      const pct=Math.min(free,need10); if(pct<10) continue;
      p.weeks[w]=pct; p.last=pct; used[w]+=pct; cnt[w]++; rem-=pct/100*a; lastW=Math.max(lastW,w); endW=w;
    }
    if(rem>0.05) lacking.push(`${p.name} (не хватает ${fmt(rem)} дн)`);
    else if(p.deadline && endW>lastOnTimeWeek(p.deadline)) late.push(`${p.name} (дедлайн ${p.deadline.split('-').reverse().join('.')})`);
  });
  if(!todo.length) toast(`${d.name}: нет проектов со статусом «Берем»`);
  else if(lacking.length||late.length){
    const parts=[];
    if(late.length) parts.push('позже дедлайна: '+late.join('; '));
    if(lacking.length) parts.push('не уместилось в квартал: '+lacking.join('; '));
    toast(`${d.name}: ${parts.join('. ')}`,true);
  }
  else toast(`${d.name}: всё уместилось${todo.some(p=>p.deadline)?' с учётом дедлайнов':''}, последний проект заканчивается на неделе с ${dm(weeks[lastW][0].d)}`);
}
let toastT=null;
function toast(msg,warn,undo){
  let t=$('#toast'); if(!t){ t=document.createElement('div'); t.id='toast'; document.body.appendChild(t); }
  t.textContent=msg; t.className=warn?'warn':''; t.style.display='block';
  if(undo){
    const b=document.createElement('button'); b.textContent='Отменить'; b.className='undo';
    b.onclick=()=>{ undo(); t.style.display='none'; };
    t.appendChild(b);
  }
  clearTimeout(toastT); toastT=setTimeout(()=>t.style.display='none',warn?9000:5000);
}
function chain(d){
  const f=focusOf(d); let cur=0;
  state.projects.filter(p=>p.designer===d.id).forEach(p=>{
    const pct=defPct(p); p.weeks={};
    const need=p.est/f; let acc=0;
    while(cur<N && acc<need-1e-9){ const a=availDays(d,cur); if(a>0){ p.weeks[cur]=pct; acc+=pct/100*a; } cur++; }
  });
}

// ---------- weekly cells: paint / move / edit ----------
let drag=null;
const gantt=$('#gantt');
const defPct = p => p.last||100;
function weekAt(drag,x){ return clamp(Math.floor((x-drag.left)/W),0,N-1); }
gantt.addEventListener('mousedown', e=>{
  if(e.button!==0) return;
  if(e.target.closest('.day')) return;
  const row=e.target.closest('.prow'); if(!row||e.target.closest('.lft')) return;
  const p=state.projects.find(x=>x.id===row.dataset.pid); if(!p) return;
  const left=row.querySelector('[data-rgt]').getBoundingClientRect().left;
  const w=clamp(Math.floor((e.clientX-left)/W),0,N-1);
  if(p.weeks[w]!=null) drag={type:'move',p,left,anchor:w,orig:{...p.weeks},moved:false};
  else { drag={type:'paint',p,left,anchor:w,base:{...p.weeks},val:defPct(p),moved:false}; p.weeks[w]=drag.val; render(); }
  e.preventDefault();
});
document.addEventListener('mousemove', e=>{
  if(!drag) return;
  const {p}=drag, w=weekAt(drag,e.clientX);
  if(drag.type==='paint'){
    const nw={...drag.base};
    for(let k=Math.min(drag.anchor,w);k<=Math.max(drag.anchor,w);k++) if(nw[k]==null) nw[k]=drag.val;
    if(JSON.stringify(nw)!==JSON.stringify(p.weeks)){ p.weeks=nw; drag.moved=true; render(); }
  } else {
    const ks=Object.keys(drag.orig).map(Number);
    const delta=clamp(w-drag.anchor,-Math.min(...ks),N-1-Math.max(...ks));
    const nw={}; ks.forEach(k=>nw[k+delta]=drag.orig[k]);
    if(JSON.stringify(nw)!==JSON.stringify(p.weeks)){ p.weeks=nw; drag.moved=true; render(); }
  }
});
document.addEventListener('mouseup', e=>{
  if(drag){
    const d=drag, seg=(!d.moved&&d.type==='move')?e.target.closest('.seg'):null;

function setPct(p,w,v){ if(v>0){ p.weeks[w]=v; p.last=v; } else delete p.weeks[w]; }
let segPop=null;

function editSeg(w,p){

// ---------- period popover (vacation / workshop / team / holiday) ----------
let pop=null;
const MN=['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
function periodsOf(d,type){
  const out=[]; let cur=null;
  flatDays.forEach((x,i)=>{
    if(d.marks[x.iso]===type){ if(cur&&cur.i===i-1){ cur.to=x; cur.i=i; cur.isos.push(x.iso); } else { cur={from:x,to:x,i,isos:[x.iso]}; out.push(cur); } }
  });
  return out;
}
const fmtIso = x => x.split('-').reverse().slice(0,2).join('.');
function rangeOf(){ if(!pop.a) return null; const b=pop.b||pop.a; return pop.a<b?[pop.a,b]:[b,pop.a]; }
function calHTML(d){
  const gm=(t,k)=>d.marks[iso(new Date(t.getFullYear(),t.getMonth(),t.getDate()+k))]===pop.type;
  const mkd=t=>{ const w=t.getDay(); return gm(t,0)||(w===6&&gm(t,-1)&&gm(t,2))||(w===0&&gm(t,-2)&&gm(t,1)); };   // выходные внутри периода тоже закрашиваем
  const {y,q}=state.cur, r=rangeOf(), lo=r&&r[0], hi=r&&r[1];
  let h='<div class="cwd">'+['пн','вт','ср','чт','пт','сб','вс'].map(x=>`<span>${x}</span>`).join('')+'</div><div class="cal">';
  for(let m=0;m<3;m++){
    const mon=(q-1)*3+m, first=new Date(y,mon,1), days=new Date(y,mon+1,0).getDate(), lead=(first.getDay()+6)%7;
    h+=`<div class="cm">${MN[mon]} ${y}</div><div class="cg">`+'<i></i>'.repeat(lead);
    for(let n=1;n<=days;n++){
      const dt=new Date(y,mon,n), id=iso(dt), cls=['cd'];
      if(dt.getDay()===0||dt.getDay()===6) cls.push('we');
      if(mkd(dt)){ cls.push('mk'); if(!mkd(new Date(y,mon,n-1))) cls.push('ml'); if(!mkd(new Date(y,mon,n+1))) cls.push('mr'); }
      if(lo){ if(id===lo) cls.push('st'); if(id===hi) cls.push('en'); if(id>lo&&id<hi) cls.push('in'); }
      h+=`<button class="${cls.join(' ')}" data-d="${id}">${n}</button>`;
    }
    h+='</div>';

let rows=[];
function parseCSV(text){
  const first=(text.split(/\r?\n/).find(l=>l.trim())||'');
  const cnt=c=>first.split(c).length-1;
  const delim=[['\t',cnt('\t')],[';',cnt(';')],[',',cnt(',')]].sort((a,b)=>b[1]-a[1])[0];
  const D=delim[1]?delim[0]:',';
  const out=[]; let row=[], cell='', q=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(q){ if(c==='"'){ if(text[i+1]==='"'){ cell+='"'; i++; } else q=false; } else cell+=c; }
    else if(c==='"') q=true;
    else if(c===D){ row.push(cell); cell=''; }
    else if(c==='\n'||c==='\r'){ if(c==='\r'&&text[i+1]==='\n') i++; row.push(cell); cell=''; out.push(row); row=[]; }
    else cell+=c;
  }
  row.push(cell); out.push(row);
  return out.filter(r=>r.some(c=>c.trim()));
}
const numOf = s => { const m=String(s||'').replace(',','.').match(/\d+(\.\d+)?/); return m?parseFloat(m[0]):0; };
function csvRefresh(guess){

    const find=(re,def)=>{ const i=hdr?names.findIndex(n=>re.test(n)):-1; return i>=0?i:def; };
    const body=rows.slice(hdr?1:0);
    const numCol=names.findIndex((_,i)=>body.length&&body.slice(0,10).filter(r=>numOf(r[i])>0).length>=Math.min(3,body.length));
    const nm=find(/проект|назв|name|задач|title|summary|тема/i,0);
    $('#cName').value=nm;
    $('#cEst').value=find(/оцен|дн|days|estimate|эстим|трудо/i, numCol>=0&&numCol!==nm?numCol:Math.min(1,ncol-1));

  const items=rows.slice(hdr?1:0).map(r=>({name:(r[ci]||'').trim(),est:numOf(r[ce]),des:cd>=0?(r[cd]||'').trim():'',team:ct>=0?(r[ct]||'').trim():''})).filter(x=>x.name);
  $('#csvPrev').innerHTML = items.length

    : '<div style="padding:10px;color:var(--muted)">Вставьте данные — здесь появится предпросмотр.</div>';
  return items;
}

// ================= Аналитика по кварталам =================
const MS=864e5;
let view='roadmap';
try{ view=localStorage.getItem('loadplanner.view')||'roadmap'; }catch(e){}
function parseKey(k){ const m=/^(\d+)-Q(\d)$/.exec(k); return {y:+m[1],q:+m[2]}; }
function qLabel(k){ const c=parseKey(k); return `Q${c.q}'${String(c.y).slice(2)}`; }
function calFor(c){
  const start=new Date(c.y,(c.q-1)*3,1), end=new Date(c.y,c.q*3,0);
  const dow=(start.getDay()+6)%7;
  const w0=dow>=5 ? new Date(c.y,(c.q-1)*3,1+(7-dow)) : new Date(c.y,(c.q-1)*3,1-dow);
  const n=Math.floor(Math.round((end-w0)/MS)/7)+1, wk=[];
  for(let w=0;w<n;w++){
    const days=[];
    for(let i=0;i<5;i++){ const d=new Date(w0.getFullYear(),w0.getMonth(),w0.getDate()+w*7+i); days.push({d,iso:iso(d),inQ:d>=start&&d<=end}); }
    wk.push(days);
  }
  return {start,end,w0,n,weeks:wk,qd:wk.flat().filter(x=>x.inQ).length};
}
function getMeta(k){
  const pr=state.periods[k]||(state.periods[k]={projects:[]});
  if(!pr.meta) pr.meta={status:'planning',log:[],notes:{}};
  return pr.meta;
}
const counts = st => st==='take'||st==='hold';          // занимает время дизайнера
function dmyTs(ts){ if(!ts) return ''; const d=new Date(ts); return pad(d.getDate())+'.'+pad(d.getMonth()+1)+'.'+d.getFullYear(); }
function dmHm(ts){ const d=new Date(ts); return pad(d.getDate())+'.'+pad(d.getMonth()+1)+' '+pad(d.getHours())+':'+pad(d.getMinutes()); }
function persist(){ try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){} }

// --- снимок плана квартала ---
function snapshotFor(key){
  const cal=calFor(parseKey(key)), P=(state.periods[key]||{projects:[]}).projects;
  const ds=state.designers.map(d=>{
    const marks={}; cal.weeks.flat().forEach(x=>{ if(x.inQ&&d.marks[x.iso]) marks[x.iso]=d.marks[x.iso]; });
    const total=(d.qd&&typeof d.qd==='object'&&d.qd[key]!=null)?d.qd[key]:cal.qd, g=state.groups.find(x=>x.id===d.group);
    return {id:d.id,name:d.name,group:g?g.name:'',focus:focusOf(d),marks,avail:total-Object.keys(marks).length};
  });
  const pr=P.map(p=>{ const t=state.teams.find(x=>x.id===p.team), tg=t&&state.groups.find(x=>x.id===t.group);
    return {id:p.id,name:p.name,designer:p.designer,team:t?t.name:'',tgroup:tg?tg.name:'',status:p.status,est:+p.est||0,weeks:{...p.weeks},deadline:p.deadline||''}; });
  return {at:new Date().toISOString(),designers:ds,projects:pr};
}
function planDaysFor(cal,marks,wm,upTo){
  let s=0;
  Object.keys(wm).forEach(k=>{ const w=+k; if(!cal.weeks[w]) return; let a=0;
    cal.weeks[w].forEach(x=>{ if(x.inQ&&!marks[x.iso]&&(!upTo||x.iso<=upTo)) a++; }); s+=wm[k]/100*a; });
  return s;
}
const wkKeys = w => Object.keys(w).map(Number).sort((a,b)=>a-b);
function shiftOf(a,b){ const ka=wkKeys(a), kb=wkKeys(b); if(!ka.length||ka.length!==kb.length) return null; const off=kb[0]-ka[0];
  return ka.every((k,i)=>kb[i]-k===off&&a[k]===b[kb[i]])?off:null; }
const sameWeeks = (a,b)=>JSON.stringify(wkKeys(a).map(k=>[k,a[k]]))===JSON.stringify(wkKeys(b).map(k=>[k,b[k]]));
const dMarks=(snap,id)=>{ const d=snap&&snap.designers.find(x=>x.id===id); return d?d.marks:{}; };

// --- журнал изменений: разница двух снимков ---
function diffSnap(a,b,key){
  const ev=[], cal=calFor(parseKey(key));
  const dn=id=>{ const d=b.designers.find(x=>x.id===id)||a.designers.find(x=>x.id===id); return d?d.name:'Без дизайнера'; };
  const ap=Object.fromEntries(a.projects.map(p=>[p.id,p])), bp=Object.fromEntries(b.projects.map(p=>[p.id,p]));
  b.projects.forEach(p=>{ if(!ap[p.id]) ev.push({kind:'add',did:p.designer,pid:p.id,name:p.name,text:`Добавлен проект «${p.name}» — ${dn(p.designer)}, оценка ${p.est} дн, статус «${ST[p.status]}»`}); });
  a.projects.forEach(p=>{ if(!bp[p.id]) ev.push({kind:'remove',did:p.designer,pid:p.id,name:p.name,text:`Удалён проект «${p.name}» (${dn(p.designer)}, был «${ST[p.status]}»)`}); });
  b.projects.forEach(p=>{
    const o=ap[p.id]; if(!o) return;
    const e=(kind,text)=>ev.push({kind,did:p.designer,pid:p.id,name:p.name,text});
    if(o.status!==p.status) e('status',`«${p.name}»: статус «${ST[o.status]}» → «${ST[p.status]}»`);
    if(o.designer!==p.designer) e('designer',`«${p.name}»: ${dn(o.designer)} → ${dn(p.designer)}`);
    if(o.team!==p.team) e('team',`«${p.name}»: команда «${o.team||'—'}» → «${p.team||'—'}»`);
    if(o.est!==p.est) e('est',`«${p.name}»: оценка ${o.est} → ${p.est} дн`);
    if(o.deadline!==p.deadline) e('deadline',`«${p.name}»: дедлайн ${o.deadline?o.deadline.split('-').reverse().join('.'):'—'} → ${p.deadline?p.deadline.split('-').reverse().join('.'):'—'}`);
    if(o.name!==p.name) e('rename',`Проект «${o.name}» переименован в «${p.name}»`);
    if(!sameWeeks(o.weeks,p.weeks)){
      const off=shiftOf(o.weeks,p.weeks);
      if(off) e('move',`«${p.name}»: перенесён на ${off>0?'+':''}${off} нед.`);
      else{ const m=dMarks(b,p.designer), da=planDaysFor(cal,m,o.weeks), db=planDaysFor(cal,m,p.weeks);
        e('weeks',`«${p.name}»: изменена раскладка по неделям (${fmt(da)} → ${fmt(db)} дн)`); }
    }
  });
  // отпуска / воркшопы / праздники
  const group={};
  const note=(id,type,act,iso)=>{ const k=id+'|'+type+'|'+act; (group[k]=group[k]||{id,type,act,days:[]}).days.push(iso); };
  b.designers.forEach(d=>{
    const ma=dMarks(a,d.id), mb=d.marks;
    new Set([...Object.keys(ma),...Object.keys(mb)]).forEach(iso=>{
      if(!ma[iso]&&mb[iso]) note(d.id,mb[iso],'+',iso);
      else if(ma[iso]&&!mb[iso]) note(d.id,ma[iso],'-',iso);
      else if(ma[iso]!==mb[iso]){ note(d.id,ma[iso],'-',iso); note(d.id,mb[iso],'+',iso); }
    });
  });
  Object.values(group).forEach(g=>{
    const days=g.days.sort(), f=x=>x.split('-').reverse().slice(0,2).join('.'), range=days.length>1?`${f(days[0])}–${f(days[days.length-1])}`:f(days[0]);
    ev.push({kind:'mark'+g.act,did:g.id,pid:'',name:'',text:`${dn(g.id)}: ${g.act==='+'?'добавлено':'убрано'} — ${TYPES[g.type]}, ${days.length} дн (${range})`});
  });
  b.designers.forEach(d=>{ if(!a.designers.some(x=>x.id===d.id)) ev.push({kind:'designer+',did:d.id,pid:'',name:'',text:`Добавлен дизайнер ${d.name}`}); });
  a.designers.forEach(d=>{ if(!b.designers.some(x=>x.id===d.id)) ev.push({kind:'designer-',did:d.id,pid:'',name:'',text:`Удалён дизайнер ${d.name}`}); });
  return ev;
}
function trackChanges(key){
  const m=getMeta(key); if(m.status!=='active'||!m.last) return false;
  const cur=snapshotFor(key), evs=diffSnap(m.last,cur,key);
  if(!evs.length) return false;
  const t=new Date().toISOString();
  evs.forEach(e=>{ e.t=t; m.log.push(e); });
  m.last=cur; persist();
  return true;
}
function trackAll(){ let ch=false; Object.keys(state.periods).forEach(k=>{ if(trackChanges(k)) ch=true; }); if(ch&&view==='analytics') renderAnalytics(); }
let trackT=null;
function scheduleTrack(){ clearTimeout(trackT); trackT=setTimeout(trackAll,700); }

// --- отчёт по кварталу ---
function buildReport(key){
  const c=parseKey(key), cal=calFor(c), meta=getMeta(key);
  const final=meta.status==='final'&&meta.final;
  const now=final?meta.final:snapshotFor(key), base=meta.base||null;
  const endIso=iso(cal.end), today=iso(new Date());
  const upTo=final?((meta.finalizedAt||'').slice(0,10)<endIso?(meta.finalizedAt||endIso).slice(0,10):endIso):today;
  const ids=[]; now.designers.forEach(d=>ids.push(d.id)); if(base) base.designers.forEach(d=>{ if(!ids.includes(d.id)) ids.push(d.id); });
  const designers=ids.map(id=>{
    const dn=now.designers.find(x=>x.id===id), db=base&&base.designers.find(x=>x.id===id), ref=dn||db;
    const rows=[], pids=new Set();
    now.projects.filter(p=>p.designer===id).forEach(p=>pids.add(p.id));
    if(base) base.projects.filter(p=>p.designer===id).forEach(p=>pids.add(p.id));
    pids.forEach(pid=>{
      const pb=base&&base.projects.find(p=>p.id===pid), pn=now.projects.find(p=>p.id===pid);
      const inNowHere=pn&&pn.designer===id, inBaseHere=pb&&pb.designer===id;
      const mN=dMarks(now,id), mB=dMarks(base,id);
      const planB=inBaseHere?planDaysFor(cal,mB,pb.weeks):0, planN=inNowHere?planDaysFor(cal,mN,pn.weeks):0;
      const capB=inBaseHere&&counts(pb.status)?planB:0, capN=inNowHere&&counts(pn.status)?planN:0;
      const spent=inNowHere&&counts(pn.status)?planDaysFor(cal,mN,pn.weeks,upTo):0;
      const tags=[];
      if(base){
        if(inNowHere&&!inBaseHere){ tags.push(pb?['other','Пришёл от другого дизайнера']:['add','Добавлен']); if(pn.status==='no') tags.push(['cancel','Отменён']); }
        else if(inBaseHere&&!inNowHere){ tags.push(pn?['other','Передан другому дизайнеру']:['rm','Удалён']); }
        else if(inBaseHere&&inNowHere){
          if(pb.status!==pn.status){
            if(pn.status==='no') tags.push(['cancel','Отменён']);
            else if(pn.status==='hold') tags.push(['hold','На паузе (Hold)']);
            else if(pb.status==='cand'&&pn.status==='take') tags.push(['take','Взят в работу']);
            else if(pn.status==='cand') tags.push(['other','Возвращён в кандидаты']);
            else tags.push(['other',`Статус: ${ST[pb.status]} → ${ST[pn.status]}`]);
          }
          if(!sameWeeks(pb.weeks,pn.weeks)){ const off=shiftOf(pb.weeks,pn.weeks); tags.push(['move',off?`Перенесён ${off>0?'+':''}${off} нед.`:'Раскладка изменена']); }
          if(pb.est!==pn.est) tags.push(['other',`Оценка ${pb.est} → ${pn.est} дн`]);
          if(pb.team!==pn.team) tags.push(['other','Команда изменена']);
        }
      }
      const r=pn&&inNowHere?pn:pb;
      rows.push({pid,name:r.name,team:r.team,tgroup:r.tgroup,deadline:(pn||pb).deadline,
        stB:inBaseHere?pb.status:null, stN:inNowHere?pn.status:(pn?pn.status:null), gone:!pn,
        estB:inBaseHere?pb.est:null, estN:inNowHere?pn.est:null, planB,planN,capB,capN,spent,tags,
        wB:inBaseHere?pb.weeks:null, wN:inNowHere?pn.weeks:null});
    });
    rows.sort((a,b)=>b.planN-a.planN||b.planB-a.planB);
    const takeB=rows.filter(r=>r.stB==='take').length, takeN=rows.filter(r=>r.stN==='take'&&!r.gone).length;
    const capB=rows.reduce((s,r)=>s+r.capB,0), capN=rows.reduce((s,r)=>s+r.capN,0), spent=rows.reduce((s,r)=>s+r.spent,0);
    const mkA={}, mkR={};
    if(base){ const A=mB0(base,id), B=dMarks(now,id);
      Object.keys(B).forEach(k=>{ if(A[k]!==B[k]) mkA[B[k]]=(mkA[B[k]]||0)+1; });
      Object.keys(A).forEach(k=>{ if(A[k]!==B[k]) mkR[A[k]]=(mkR[A[k]]||0)+1; }); }
    const o={id,name:ref.name,group:ref.group||'',avail:dn?dn.avail:(db?db.avail:0),rows,takeB,takeN,capB,capN,spent,mkA,mkR,removed:!dn};
    o.text=autoText(o,!!base);
    return o;
  });
  return {key,c,cal,meta,base,now,upTo,final,designers};
}
function mB0(base,id){ return dMarks(base,id); }
function nProj(n){ const a=n%100, b=n%10; return n+' '+((a>10&&a<15)?'проектов':b===1?'проект':(b>1&&b<5)?'проекта':'проектов'); }
function autoText(d,hasBase){
  const q=a=>a.map(r=>`«${r.name}»`).join(', ');
  const s=[], act=d.rows.filter(r=>r.stN&&counts(r.stN)&&!r.gone&&r.planN>0);
  if(hasBase) s.push(`На старте в работе было ${nProj(d.takeB)} (план ${fmt(d.capB)} дн), сейчас — ${d.takeN} (план ${fmt(d.capN)} дн).`);
  else s.push(`В плане ${nProj(d.takeN)} в работе (${fmt(d.capN)} дн).`);
  const top=[...act].sort((a,b)=>b.planN-a.planN).slice(0,3);
  if(top.length){ const tot=d.capN||1; s.push('Больше всего времени: '+top.map(r=>`«${r.name}» — ${fmt(r.planN)} дн (${Math.round(r.planN/tot*100)}%)`).join(', ')+'.'); }
  if(hasBase){
    const by=t=>d.rows.filter(r=>r.tags.some(x=>x[0]===t));
    const add=by('add'), rm=by('rm'), cancel=by('cancel'), hold=by('hold'), take=by('take'), move=by('move');
    if(cancel.length) s.push('Отменено: '+q(cancel)+'.');
    if(rm.length) s.push('Удалено из плана: '+q(rm)+'.');
    if(add.length) s.push('Добавлено после старта: '+q(add)+'.');
    if(take.length) s.push('Взято из кандидатов: '+q(take)+'.');
    if(hold.length) s.push('На паузе (Hold): '+q(hold)+'.');
    if(move.length) s.push('Перенесено / изменена раскладка: '+q(move)+'.');
    const est=d.rows.filter(r=>r.tags.some(x=>/^Оценка/.test(x[1])));
    if(est.length) s.push('Изменена оценка: '+est.map(r=>`«${r.name}» (${r.tags.find(x=>/^Оценка/.test(x[1]))[1].replace('Оценка ','')})`).join(', ')+'.');
    const parts=[]; Object.keys(d.mkA).forEach(t=>parts.push(`${TYPES[t]} +${d.mkA[t]} дн`)); Object.keys(d.mkR).forEach(t=>parts.push(`${TYPES[t]} −${d.mkR[t]} дн`));
    if(parts.length) s.push('Календарь: '+parts.join(', ')+'.');
    if(!cancel.length&&!rm.length&&!add.length&&!take.length&&!hold.length&&!move.length&&!est.length&&!parts.length) s.push('С момента старта план не менялся.');
  }
  const pend=d.rows.filter(r=>r.stN==='cand'&&!r.gone), no=d.rows.filter(r=>r.stN==='no'&&!r.gone&&!r.tags.some(x=>x[0]==='cancel'));
  if(pend.length) s.push('Кандидаты (не в капасити): '+q(pend)+'.');
  if(no.length) s.push('Не берём: '+q(no)+'.');
  s.push(`Потрачено ≈ ${fmt(d.spent)} дн из ${fmt(d.avail)} доступных (${d.avail?Math.round(d.spent/d.avail*100):0}%).`);
  return s.join(' ');
}

// --- старт / завершение квартала ---
function startQuarter(key){
  const m=getMeta(key); if(m.status!=='planning') return;
  m.status='active'; m.startedAt=new Date().toISOString(); m.base=snapshotFor(key); m.last=m.base; m.log=[];
  persist(); render();
  toast(`${qLabel(key)}: план на старт зафиксирован. Дальше записываю все изменения.`);
}
function finalizeQuarter(key,auto){
  const m=getMeta(key); if(m.status!=='active') return;
  trackChanges(key);
  m.final=snapshotFor(key); m.status='final'; m.finalizedAt=new Date().toISOString();
  const rep=buildReport(key); m.autoText={}; rep.designers.forEach(d=>{ m.autoText[d.id]=d.text; });
  persist(); render();
  toast(auto?`${qLabel(key)} закончился — отчёт финализирован автоматически.`:`${qLabel(key)}: отчёт финализирован.`);
}
function reopenQuarter(key){
  const m=getMeta(key); if(m.status!=='final') return;
  m.status='active'; m.last=snapshotFor(key); delete m.final; delete m.autoText; persist(); render();
  toast(`${qLabel(key)} снова в работе — изменения записываются.`);
}
function todayCur(){ const n=new Date(); return {y:n.getFullYear(),q:Math.floor(n.getMonth()/3)+1}; }
function autoPeriods(notify){
  let changed=false; const tk=keyOf(todayCur());
  if(!state.periods[tk]||!state.periods[tk].meta){ const fresh=!state.periods[tk]; getMeta(tk); changed=true; if(notify&&fresh) toast(`Начался ${qLabel(tk)}. Квартал создан — нажмите «Старт квартала», чтобы зафиксировать план.`); }
  Object.keys(state.periods).forEach(k=>{
    const m=getMeta(k);
    if(m.status==='active'&&iso(new Date())>iso(calFor(parseKey(k)).end)){ finalizeQuarter(k,true); changed=true; }
  });
  if(changed){ persist(); if(notify) render(); }
}

// --- экспорт CSV ---
function csvCell(v){ v=String(v==null?'':v); return /[";\n\r]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v; }
function downloadCsv(name,rows){
  const text='﻿'+rows.map(r=>r.map(csvCell).join(';')).join('\r\n');
  const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([text],{type:'text/csv;charset=utf-8'})); a.download=name; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}
function weeksStr(cal,w){ if(!w) return ''; return wkKeys(w).map(k=>`${cal.weeks[k]?dm(cal.weeks[k][0].d):k}:${w[k]}%`).join(', '); }
function reportRows(key){
  const rep=buildReport(key), m=rep.meta, c=rep.c, ds=rep.designers, out=[];
  ds.forEach(d=>{
    const note=[ (m.status==='final'&&m.autoText&&m.autoText[d.id])||d.text, (m.notes||{})[d.id]?'Комментарий: '+m.notes[d.id]:'' ].filter(Boolean).join(' | ');
    const common=[d.takeB,d.takeN,fmt(d.capB),fmt(d.capN),fmt(d.spent),d.avail,note];
    const hasBase=!!rep.base;
    if(!d.rows.length) out.push([c.y,'Q'+c.q,stLabel(m),d.group,d.name,'','','','','','','','','','','','','',...common]);
    d.rows.forEach(r=>out.push([c.y,'Q'+c.q,stLabel(m),d.group,d.name,r.name,r.team,r.tgroup,
      hasBase&&r.stB?ST[r.stB]:'', r.gone?'удалён':(r.stN?ST[r.stN]:''), hasBase&&r.estB!=null?r.estB:'', r.estN!=null?r.estN:'',
      hasBase&&r.stB?fmt(r.planB):'', r.gone?'':fmt(r.planN), fmt(r.spent), hasBase?weeksStr(rep.cal,r.wB):'', weeksStr(rep.cal,r.wN),
      r.tags.map(x=>x[1]).join('; '), r.deadline?r.deadline.split('-').reverse().join('.'):'', ...common]));
  });
  return out;
}
const REPORT_HEAD=['Год','Квартал','Статус квартала','Группа дизайнера','Дизайнер','Проект','Команда','Группа команд','Статус на старте','Статус сейчас/итог','Оценка на старте, дн','Оценка сейчас/итог, дн','План на старте, дн','План сейчас/итог, дн','Потрачено факт, дн','Недели на старте','Недели сейчас/итог','Изменения','Дедлайн','Взято в работу на старте (у дизайнера)','Взято в работу сейчас (у дизайнера)','Капасити план на старте (у дизайнера), дн','Капасити план сейчас (у дизайнера), дн','Потрачено у дизайнера, дн','Доступно у дизайнера, дн','Комментарий по дизайнеру'];
function exportCsv(){
  trackAll();
  const kind=($('#expKind')||{}).value||'q', key=keyOf(state.cur), c=state.cur;
  if(kind==='log'){
    const m=getMeta(key), names=Object.fromEntries(state.designers.map(d=>[d.id,d.name]));
    const rows=[['Год','Квартал','Время','Тип','Дизайнер','Проект','Описание']].concat((m.log||[]).map(e=>[c.y,'Q'+c.q,dmHm(e.t),e.kind,names[e.did]||'',e.name||'',e.text]));
    downloadCsv(`journal-${c.y}-Q${c.q}.csv`,rows);
  } else if(kind==='y'){
    const rows=[REPORT_HEAD]; [1,2,3,4].forEach(q=>reportRows(keyOf({y:c.y,q})).forEach(r=>rows.push(r)));
    downloadCsv(`report-${c.y}.csv`,rows);
  } else downloadCsv(`report-${c.y}-Q${c.q}.csv`,[REPORT_HEAD].concat(reportRows(key)));
}

autoPeriods(true);
setInterval(()=>autoPeriods(true),60000);
window.addEventListener('beforeunload',()=>{ try{ trackAll(); }catch(e){} });
render();
})();
